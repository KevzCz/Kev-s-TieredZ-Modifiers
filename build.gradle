plugins {
    id "me.shedaniel.unified-publishing" version "0.1.+"
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dirs 'lib'
	}
	maven { url "https://api.modrinth.com/maven" }
	maven {url "https://cursemaven.com" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "curse.maven:kevs-library-984932:7599460"
	modImplementation name: 'tiered-1.2.5'
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Soft dependency: compile against Spell Engine for spell_surge's cooldown-refund (touches SE internals).
	// Runtime use is guarded by FabricLoader.isModLoaded("spell_engine") in isolated classes; not bundled.
	modCompileOnly "maven.modrinth:spell-engine:${spell_engine_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Java autogeneration of this addon's imprint definition JSON into generated/data/kevs-tieredz-modifiers/.
// Plain JavaExec (not Fabric datagen) so it never affects the mod build/runtime. Run: gradlew runKevsImprintDatagen
tasks.register('runKevsImprintDatagen', JavaExec) {
	group = 'kevstieredz'
	description = 'Generates imprint definition JSON under generated/data/kevs-tieredz-modifiers/.'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.pixeldreamstudios.kevstieredzmodifiers.datagen.KevsImprintDatagen'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

unifiedPublishing {
    project {
        gameVersions = ["1.21.1"]
        gameLoaders = ["fabric"]

        mainPublication tasks.remapJar
        displayName = "Kev's TieredZ Modifiers [FABRIC] [${rootProject.minecraft_version}] - [${project.version}]"

        releaseType = "release"

        def changelogFile = rootProject.file("CHANGELOG.md")
        def changelogText = changelogFile.exists() ? changelogFile.text : ""
        changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

        var cfToken = project.findProperty("cfToken") ?: System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "972997"
                gameVersions = ["1.21.1", "Java 21"]
            }
        }

        var mrToken = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "Bb3Fi2JX"
            }
        }
    }
}

tasks.matching { it.name.startsWith("modrinth") }.configureEach {
    group = "upload"
}

ext.CURSEFORGE_ENVIRONMENT_IDS = ["Client": 9638, "Server": 9639]

gradle.taskGraph.whenReady {
    rootProject.allprojects.each { sub ->
        sub.tasks.matching { it.getClass().name.contains("CurseUploadTask") }.each { task ->
            task.actions.clear()
            task.doLast {
                def loader = task.getClass().getClassLoader()
                def versions = Class.forName("com.matthewprenger.cursegradle.CurseVersions", true, loader)
                def util = Class.forName("com.matthewprenger.cursegradle.Util", true, loader)
                def artifact = task.mainArtifact

                artifact.resolve(task.project)
                versions.initialize(task.apiKey)

                def field = versions.getDeclaredField("gameVersions")
                field.setAccessible(true)
                def nameToId = field.get(null)
                rootProject.CURSEFORGE_ENVIRONMENT_IDS.each { name, id -> nameToId.put(name, id) }

                def tags = new ArrayList(artifact.gameVersionStrings)
                tags.addAll(rootProject.CURSEFORGE_ENVIRONMENT_IDS.keySet())

                def resolved = artifact.getClass().getDeclaredField("gameVersions")
                resolved.setAccessible(true)
                resolved.set(artifact, versions.resolveGameVersion(tags))

                task.uploadFile(util.gson.toJson(artifact), artifact.artifact as File)
                task.logger.lifecycle("Uploaded ${artifact.artifact.name} to CurseForge with tags ${tags}")
            }
        }
    }
}
